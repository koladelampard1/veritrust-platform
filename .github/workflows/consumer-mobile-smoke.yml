name: Consumer mobile browser smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/consumer.mobile.spec.ts --project=chromium
        env:
          VERITRUST_BASE_URL: https://veritrust-platform.vercel.app
